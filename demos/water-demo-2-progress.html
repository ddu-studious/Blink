<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案B: 进度仪表盘 - 喝水提醒 Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #0c1222 0%, #1a1a2e 50%, #0f172a 100%);
    color: #e2e8f0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 32px; padding: 40px 20px;
  }

  .badge {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(59,130,246,0.15); border: 1px solid rgba(59,130,246,0.3);
    padding: 6px 16px; border-radius: 20px;
    font-size: 12px; color: #93c5fd; letter-spacing: 0.5px;
  }

  /* 圆形进度 */
  .ring-container {
    position: relative; width: 240px; height: 240px;
  }
  .ring-bg, .ring-progress {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  }
  .ring-bg circle { fill: none; stroke: rgba(59,130,246,0.1); stroke-width: 12; }
  .ring-progress circle {
    fill: none; stroke: url(#blueGrad); stroke-width: 12;
    stroke-linecap: round;
    stroke-dasharray: 691.15; stroke-dashoffset: 691.15;
    transform: rotate(-90deg); transform-origin: center;
    transition: stroke-dashoffset 1s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .ring-center {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    text-align: center;
  }
  .ring-pct { font-size: 56px; font-weight: 200; letter-spacing: -3px; }
  .ring-label { font-size: 12px; color: #64748b; margin-top: 2px; }

  /* 信息卡片区 */
  .cards {
    display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 500px;
  }
  .card {
    background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(71,85,105,0.3);
    border-radius: 16px; padding: 16px 20px; min-width: 110px;
    backdrop-filter: blur(10px); text-align: center;
  }
  .card-value { font-size: 24px; font-weight: 300; color: #f1f5f9; }
  .card-label { font-size: 11px; color: #64748b; margin-top: 4px; }
  .card-icon { font-size: 20px; margin-bottom: 6px; }
  .card.goal-reached { border-color: rgba(52,211,153,0.4); }
  .card.goal-reached .card-value { color: #34d399; }

  /* 时间线 */
  .timeline {
    display: flex; gap: 6px; align-items: end; height: 60px; padding: 0 20px;
  }
  .timeline-bar {
    width: 24px; background: rgba(59,130,246,0.2); border-radius: 4px 4px 0 0;
    transition: height 0.5s ease, background 0.3s;
    position: relative; cursor: pointer;
  }
  .timeline-bar:hover { background: rgba(59,130,246,0.4); }
  .timeline-bar.active { background: linear-gradient(180deg, #60a5fa, #3b82f6); }
  .timeline-bar .time {
    position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%);
    font-size: 9px; color: #475569; white-space: nowrap;
  }

  /* 按钮组 */
  .actions {
    display: flex; gap: 10px;
  }
  .btn {
    padding: 12px 28px; border-radius: 14px; border: none;
    font-size: 14px; font-family: inherit; cursor: pointer;
    transition: all 0.2s;
  }
  .btn-outline {
    background: rgba(59,130,246,0.08); border: 1.5px solid rgba(59,130,246,0.25);
    color: #93c5fd;
  }
  .btn-outline:hover { background: rgba(59,130,246,0.15); transform: translateY(-1px); }
  .btn-fill {
    background: linear-gradient(135deg, #3b82f6, #2563eb); color: white;
    box-shadow: 0 4px 16px rgba(59,130,246,0.3);
  }
  .btn-fill:hover { box-shadow: 0 6px 24px rgba(59,130,246,0.4); transform: translateY(-1px); }

  /* 浮动通知 */
  .toast {
    position: fixed; top: 60px; left: 50%; transform: translateX(-50%) translateY(-20px);
    background: rgba(30,41,59,0.95); border: 1px solid rgba(59,130,246,0.3);
    padding: 10px 20px; border-radius: 12px; font-size: 13px;
    opacity: 0; transition: all 0.3s; pointer-events: none;
    backdrop-filter: blur(12px);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .tip {
    position: fixed; bottom: 20px;
    font-size: 11px; color: #475569; text-align: center; line-height: 1.6;
  }
</style>
</head>
<body>

<div class="badge">方案 B · 进度仪表盘风格</div>
<div class="toast" id="toast"></div>

<!-- 圆形进度环 -->
<div class="ring-container">
  <svg class="ring-bg" viewBox="0 0 240 240">
    <circle cx="120" cy="120" r="110" />
  </svg>
  <svg class="ring-progress" viewBox="0 0 240 240">
    <defs>
      <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#60a5fa" />
        <stop offset="100%" style="stop-color:#3b82f6" />
      </linearGradient>
    </defs>
    <circle cx="120" cy="120" r="110" id="progressCircle" />
  </svg>
  <div class="ring-center">
    <div class="ring-pct" id="pctText">0%</div>
    <div class="ring-label" id="mlText">0 / 2000 ml</div>
  </div>
</div>

<!-- 统计卡片 -->
<div class="cards">
  <div class="card">
    <div class="card-icon">💧</div>
    <div class="card-value" id="cupsValue">0</div>
    <div class="card-label">杯数</div>
  </div>
  <div class="card">
    <div class="card-icon">🎯</div>
    <div class="card-value" id="remainValue">8</div>
    <div class="card-label">还差 (杯)</div>
  </div>
  <div class="card" id="streakCard">
    <div class="card-icon">🔥</div>
    <div class="card-value">5</div>
    <div class="card-label">连续天数</div>
  </div>
  <div class="card">
    <div class="card-icon">⏰</div>
    <div class="card-value" id="nextReminder">--</div>
    <div class="card-label">下次提醒</div>
  </div>
</div>

<!-- 今日时间线 -->
<div class="timeline" id="timeline"></div>

<!-- 操作按钮 -->
<div class="actions">
  <button class="btn btn-outline" onclick="record(250)">+250ml</button>
  <button class="btn btn-fill" onclick="record(500)">+500ml 🥤</button>
  <button class="btn btn-outline" onclick="record(750)">+750ml</button>
</div>

<div class="tip">
  设计理念: DeskBreak 风格仪表盘 · 圆环进度 · 时间线追踪 · 连续打卡<br>
  适合: 统计仪表盘或设置页中的喝水追踪面板
</div>

<script>
  let total = 0;
  const goal = 2000;
  const circumference = 2 * Math.PI * 110;
  const records = [];

  // 初始化时间线
  function initTimeline() {
    const tl = document.getElementById('timeline');
    for (let h = 8; h <= 20; h++) {
      const bar = document.createElement('div');
      bar.className = 'timeline-bar';
      bar.style.height = '4px';
      bar.dataset.hour = h;
      const time = document.createElement('span');
      time.className = 'time';
      time.textContent = h + ':00';
      if (h % 2 !== 0) time.style.display = 'none';
      bar.appendChild(time);
      tl.appendChild(bar);
    }
  }
  initTimeline();

  function record(amount) {
    total = Math.min(total + amount, goal + 1000);
    const pct = Math.min(total / goal, 1);

    // 圆环
    const offset = circumference * (1 - pct);
    document.getElementById('progressCircle').style.strokeDashoffset = offset;
    document.getElementById('pctText').textContent = Math.round(pct * 100) + '%';
    document.getElementById('mlText').textContent = `${total} / ${goal} ml`;

    // 卡片
    const cups = Math.round(total / 250);
    const remaining = Math.max(Math.ceil((goal - total) / 250), 0);
    document.getElementById('cupsValue').textContent = cups;
    document.getElementById('remainValue').textContent = remaining;

    // 时间线
    const hour = new Date().getHours();
    const bar = document.querySelector(`.timeline-bar[data-hour="${Math.max(8, Math.min(hour, 20))}"]`);
    if (bar) {
      const existing = parseInt(bar.dataset.amount || '0');
      const newAmount = existing + amount;
      bar.dataset.amount = newAmount;
      bar.style.height = Math.min(4 + (newAmount / 250) * 14, 56) + 'px';
      bar.classList.add('active');
    }

    // 下次提醒
    const nextH = hour + 1;
    document.getElementById('nextReminder').textContent = nextH > 20 ? '明天' : `${nextH}:00`;

    // 达标
    if (total >= goal) {
      document.getElementById('pctText').style.color = '#34d399';
      showToast('🎉 今日饮水目标已达成！太棒了！');
    } else {
      showToast(`+${amount}ml 已记录 💧`);
    }
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }
</script>
</body>
</html>
